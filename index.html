
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grandmaster Live - Elite Chess Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050507;
            --accent-color: #6366f1;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% -20%, #1e1b4b 0%, transparent 50%),
                radial-gradient(circle at 0% 100%, #0c0a09 0%, transparent 40%);
            color: #fafafa;
            overflow: hidden;
            height: 100vh;
        }
        .chess-board-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            box-shadow: 0 0 80px rgba(0, 0, 0, 0.5);
        }
        .square-light { 
            background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%); 
        }
        .square-dark { 
            background: linear-gradient(135deg, #475569 0%, #334155 100%); 
        }
        .square-last-move { 
            box-shadow: inset 0 0 0 4px rgba(255, 255, 0, 0.4) !important;
            background: rgba(255, 255, 0, 0.15) !important;
        }
        .square-highlight { background-color: rgba(99, 102, 241, 0.3) !important; }
        .square-check { 
            background: radial-gradient(circle, rgba(239, 68, 68, 0.6) 0%, transparent 70%) !important;
        }
        
        /* Custom Premium Scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(24, 24, 27, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: #3f3f46;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6366f1;
        }

        /* Piece Animation */
        .piece-transition {
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Glassmorphism */
        .glass-panel {
            background: rgba(15, 15, 20, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        @keyframes subtle-glow {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 0.8; }
        }
        .glow-effect {
            animation: subtle-glow 4s ease-in-out infinite;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "lucide-react": "https://esm.sh/lucide-react@^0.564.0"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
